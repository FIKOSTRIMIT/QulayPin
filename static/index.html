<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>QulayPin — игровые пополнения</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/navigation.css">
  <link rel="stylesheet" href="/static/animations.css">
  <link rel="stylesheet" href="/static/game-detail.css">
  <link rel="stylesheet" href="/static/checkout.css">
  <link rel="stylesheet" href="/static/profile.css">
  <link rel="stylesheet" href="/static/profile-motion.css">
  <link rel="stylesheet" href="/static/promo-referral.css">
  <link rel="stylesheet" href="/static/mobile-store.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar">
      <button class="brand" data-route="home" aria-label="QulayPin, на главную"><span class="brand-mark">Q</span><span>Qulay<span>Pin</span></span></button>
      <div class="balance-mini"><div><small>Баланс</small><strong id="headerBalance">0 сум</strong></div><button class="add-balance" data-route="topup" aria-label="Пополнить баланс">+</button></div>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Основная навигация">
      <span class="nav-bubble" aria-hidden="true"></span>
      <button class="nav-btn active" data-route="home"><span class="nav-icon">⌂</span><small>Главная</small></button>
      <button class="nav-btn" data-route="catalog"><span class="nav-icon">▦</span><small>Каталог</small></button>
      <button class="nav-btn" data-route="orders"><span class="nav-icon">◷</span><small>Заказы</small></button>
      <button class="nav-btn" data-route="profile"><span class="nav-icon">○</span><small>Профиль</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
